<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お問い合わせ｜西光寺</title>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&family=Zen+Old+Mincho&display=swap" rel="stylesheet">


<style>

/* =====================================
   お問い合わせページ
===================================== */

.contact-page{
  background:#fff;
  padding-bottom:80px;
}


/* =====================================
   ページタイトル
===================================== */

.contact-hero{
  text-align:center;
  padding:70px 20px 45px;
  background:#fff;
}

.contact-hero h1{
  font-family:"Shippori Mincho B1", serif;
  font-size:36px;
  font-weight:400;
  letter-spacing:7px;
  margin:0 0 8px;
  color:#333;
}

.contact-hero p{
  font-family:"Shippori Mincho B1", serif;
  font-size:13px;
  letter-spacing:4px;
  color:#999;
  margin:0;
}


/* 飾り */

.contact-decoration{
  width:40px;
  height:1px;
  background:#c9b99b;
  margin:18px auto 25px;
  position:relative;
}

.contact-decoration::before,
.contact-decoration::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  border:1px solid #c9b99b;
  transform:rotate(45deg);
  top:-3px;
}

.contact-decoration::before{
  left:4px;
}

.contact-decoration::after{
  right:4px;
}


/* 説明文 */

.contact-lead{
  text-align:center;
  font-family:"Shippori Mincho B1", serif;
  font-size:14px;
  letter-spacing:2px;
  color:#666;
  margin:0 0 45px;
}


/* =====================================
   写真＋フォーム
===================================== */

.contact-main{
  max-width:970px;
  margin:0 auto;
  padding:0 20px;

  display:grid;
  grid-template-columns:430px 1fr;
  gap:45px;

  align-items:start;
}


/* 写真 */

.contact-images{
  column-count:2;
  column-gap:10px;
}

.contact-images img{
  width:100%;
  height:auto;

  display:block;

  margin:0 0 10px;

  border-radius:6px;

  break-inside:avoid;

  box-shadow:0 1px 5px rgba(0,0,0,.08);
}


/* =====================================
   フォーム
===================================== */

.contact-form{
  background:#fff;
  padding:15px 0 0;
}

.form-group{
  margin-bottom:27px;
}

.form-group label{
  display:flex;
  align-items:center;
  gap:10px;

  font-family:"Shippori Mincho B1", serif;
  font-size:14px;
  font-weight:600;

  letter-spacing:.08em;

  color:#333;

  margin-bottom:9px;
}


/* 必須 */

.required{
  display:inline-block;

  background:#d85a4a;
  color:#fff;

  font-family:sans-serif;
  font-size:10px;
  font-weight:normal;

  letter-spacing:0;

  padding:3px 7px;

  border-radius:2px;
}


/* 入力 */

.contact-form input,
.contact-form select,
.contact-form textarea{

  width:100%;

  box-sizing:border-box;

  border:1px solid #ddd;

  background:#fff;

  border-radius:3px;

  padding:14px 15px;

  font-family:"Shippori Mincho B1", serif;

  font-size:14px;

  color:#555;

  outline:none;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
  color:#c2c2c2;
}

.contact-form input:focus,
.contact-form select:focus,
.contact-form textarea:focus{
  border-color:#b8a989;
}

.contact-form select{
  appearance:auto;
  color:#999;
}

.contact-form textarea{
  height:145px;
  resize:vertical;
}


/* =====================================
   個人情報
===================================== */

.privacy{
  margin-top:40px;
  margin-bottom:25px;
}

.privacy h3{
  font-family:"Shippori Mincho B1", serif;

  font-size:14px;

  font-weight:600;

  letter-spacing:.08em;

  margin:0 0 12px;

  color:#333;
}

.privacy p{
  font-family:"Shippori Mincho B1", serif;

  font-size:12px;

  line-height:2;

  color:#888;

  margin:0 0 15px;
}

.agree{
  display:flex;

  align-items:center;

  gap:10px;

  font-family:"Shippori Mincho B1", serif;

  font-size:12px;

  color:#555;
}

.agree input{
  width:20px;
  height:20px;

  margin:0;
}

.agree .required{
  margin-left:3px;
}


/* =====================================
   確認ボタン
===================================== */

.confirm-btn{
  width:100%;

  height:52px;

  border:none;

  border-radius:28px;

  background:#333;

  color:#fff;

  font-family:"Shippori Mincho B1", serif;

  font-size:15px;

  letter-spacing:.1em;

  cursor:pointer;

  margin-top:28px;

  transition:.3s;
}

.confirm-btn:hover{
  background:#555;
}


/* =====================================
   電話・SNS
===================================== */

.contact-bottom{

  max-width:900px;

  margin:80px auto 0;

  padding:50px 20px 0;

  border-top:1px solid #c9a227;

  text-align:center;
}

.contact-phone h3{

  font-family:"Shippori Mincho B1", serif;

  font-size:20px;

  font-weight:400;

  letter-spacing:.12em;

  margin:0 0 18px;
}

.contact-phone a{

  color:#333;

  text-decoration:none;

  font-size:23px;

  letter-spacing:.08em;
}


/* SNS */

.sns-area{

  display:flex;

  justify-content:center;

  gap:60px;

  margin-top:40px;
}

.sns-area a{

  text-decoration:none;

  color:#333;

  text-align:center;
}

.sns-area img{

  width:55px;

  height:55px;

  object-fit:contain;

  margin:0 auto 8px;
}

.sns-area p{

  margin:0;

  font-size:13px;
}


/* =====================================
   スマホ
===================================== */

@media(max-width:768px){

  .contact-hero{

    padding:55px 20px 35px;
  }

  .contact-hero h1{

    font-size:29px;

    letter-spacing:5px;
  }

  .contact-lead{

    font-size:13px;

    margin-bottom:35px;
  }

  .contact-main{

    display:block;

    padding:0 20px;
  }

  .contact-images{

    column-count:2;

    column-gap:8px;

    margin-bottom:45px;
  }

  .contact-images img{

    margin-bottom:8px;
  }

  .contact-form{

    padding:0;
  }

  .contact-bottom{

    margin:60px 20px 0;
  }

}

</style>

</head>


<body>

<!-- =====================================
     お問い合わせ
===================================== -->

<main>

<section class="contact-page">


  <!-- タイトル -->

  <header class="contact-hero">

    <h1>
      お問い合わせ
    </h1>

    <p>
      Contact
    </p>

    <div class="contact-decoration"></div>

    <p class="contact-lead">
      ご質問・ご相談など、お気軽にお問い合わせください。
    </p>

  </header>



  <!-- =====================================
       写真＋フォーム
  ===================================== -->

  <div class="contact-main">


    <!-- 写真 -->

    <div class="contact-images">

      <img src="images/FEF231C7-CC84-4108-99FF-E39889BC46F6.JPEG">

      <img src="images/BE584FDE-764A-4108-9BAE-8AE7DD078787.JPEG">

      <img src="images/IMG_4096.JPG">

      <img src="images/IMG_4106.JPG">

      <img src="images/IMG_5420.JPG">

      <img src="images/IMG_5471.JPG">

      <img src="images/IMG_5570.JPG">

      <img src="images/43810C98-5E9C-4A87-864B-58EE865A26D9.JPEG">

    </div>



    <!-- フォーム -->

    <div class="contact-form">


      <div class="form-group">

        <label>
          お名前
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          placeholder="例）山田 太郎"
        >

      </div>



      <div class="form-group">

        <label>
          ふりがな
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          placeholder="例）やまだ たろう"
        >

      </div>



      <div class="form-group">

        <label>
          メールアドレス
          <span class="required">必須</span>
        </label>

        <input
          type="email"
          placeholder="例）example@email.com"
        >

      </div>



      <div class="form-group">

        <label>
          電話番号
        </label>

        <input
          type="tel"
          placeholder="例）090-1234-5678"
        >

      </div>



      <div class="form-group">

        <label>
          お問い合わせの種類
          <span class="required">必須</span>
        </label>

        <select>

          <option value="">
            選択してください
          </option>

          <option>
            お寺について
          </option>

          <option>
            法要・法事について
          </option>

          <option>
            納骨について
          </option>

          <option>
            前撮り撮影について
          </option>

          <option>
            その他
          </option>

        </select>

      </div>



      <div class="form-group">

        <label>
          お問い合わせ内容
          <span class="required">必須</span>
        </label>

        <textarea
          placeholder="ご質問・ご相談内容をご入力ください"
        ></textarea>

      </div>



      <!-- 個人情報 -->

      <div class="privacy">

        <h3>
          個人情報の取り扱いについて
        </h3>

        <p>
          ご入力いただいた個人情報は、お問い合わせへの回答のみに使用いたします。
        </p>

        <label class="agree">

          <input type="checkbox">

          <span>
            上記の内容に同意します
          </span>

          <span class="required">
            必須
          </span>

        </label>

      </div>



      <!-- 確認ボタン -->

      <button
        type="button"
        class="confirm-btn"
      >
        確認画面へ進む
      </button>


    </div>

  </div>



  <!-- =====================================
       電話・SNS
  ===================================== -->

  <section class="contact-bottom">


    <div class="contact-phone">

      <h3>
        お電話でのお問い合わせ
      </h3>

      <a href="tel:0790-62-0549">
        ☎ 0790-62-0549
      </a>

    </div>



    <div class="sns-area">

      <a
        href="LINEのURL"
        target="_blank"
      >

        <img
          src="images/icons8-line-480.png"
          alt="LINE"
        >

        <p>
          LINE
        </p>

      </a>



      <a
        href="https://www.instagram.com/_gomyo_saikoji/"
        target="_blank"
      >

        <img
          src="images/tempImagelKLraI-Photoroom.png"
          alt="Instagram"
        >

        <p>
          Instagram
        </p>

      </a>

    </div>


  </section>
